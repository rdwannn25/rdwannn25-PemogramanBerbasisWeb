<!DOCTYPE html>
<html lang="en">
<head>
    <title> Menambahkan image </title>
</head>
<body>
    <h4> Menambahkan image ke dokumen HTML </h4>
    <img src="Karakter/spongebob.png" width="100" height="120">
    <br> 
    <h4> Mengatur Border Pada Image </h4>
    <img src="Karakter/spongebob.png" border="10" style="border-color: aquamarine;">
    <br>
    <h4> Alternating Text </h4>
    Pada image dibawah ini terdapat alternating text.
    Silahkan gerakan mouse melewati image <br>
    <img src="Karakter/spongebob.png" width="100" height="120" alt="Alternating text"> 
</body>
</html>
