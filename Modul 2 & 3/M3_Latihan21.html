<!DOCTYPE html>
<html lang="en">
<head>
    <title> Registrasi </title>
</head>
<body>
   <form action="contact.php" method="POST">
    <fieldset>
    <legend>Registrasi</legend>
    <p>
        <label>Nama:</label>
        <input type="text" name="nama" placeholder="Nama lengkap..."/>
    </p>
    <p>
        <label>Username:</label>
        <input type="text" name="username" placeholder="Username..."/>  
    </p>
    <p>
        <label>Email:</label>
        <input type="email" name="email" placeholder="Email Anda..."/>  
    </p>
    <p>
        <label>Password:</label>
        <input type="password" name="password" placeholder="Password..."/>  
    </p>
    <p>
        <label>Jenis Kelamin</label>
        <input type="radio" name="jenis_kelamin" value="laki-laki"> Laki-laki</label>
        <input type="radio" name="jenis_kelamin" value="perempuan"> Perempuan</label>
    </p>
    <p>
        <label>Agama:</label>
        <select value="Agama">
            <option value="Islam">Islam</option>
            <option value="Kristen">Kristen</option>
            <option value="Khatolik">Katholik</option>
            <option value="Hindu">Hindu</option>
            <option value="Buddha">Buddha</option>
        </select>
    </p>
    <p>
        <label>biografi:</label>
        <textarea name="biografi"></textarea>
    </p>
    <p>
        <input type="submit" name="submit" value="Daftar">
    </p>
    </fieldset>
   </form> 
</body>
</html>
